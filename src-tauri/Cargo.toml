[package]
name = "zenith-core"
version = "0.1.22"
description = "Zenith - macOS AI & Developer System Manager"
authors = ["Zenith Team"]
edition = "2021"

[lib]
name = "zenith_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "Zenith"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = ["macos-private-api", "tray-icon", "image-png"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
uuid = { version = "1.10", features = ["v4", "serde"] }
sysinfo = "0.33"
walkdir = "2.5"
libc = "0.2"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
sha2 = "0.10"
url = "2.5"
specta = { version = "=2.0.0-rc.25", features = ["derive", "uuid"] }
tauri-specta = { version = "=2.0.0-rc.25", features = ["typescript"] }
tauri-plugin-notification = "2"
regex = "1.10"
plist = "1.7"
trash = "5.2"
rayon = "1.12"

[target.'cfg(target_os = "macos")'.dependencies]
tauri = { version = "2.0", features = ["macos-private-api"] }

[dev-dependencies]
tempfile = "3.13"
specta-typescript = "=0.0.12"

[features]
# Plain `cargo build` must produce a self-contained desktop binary. The
# Tauri CLI disables default features for `tauri dev`, so development still
# uses `build.devUrl`, while direct/release builds serve the embedded `dist`.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
