[package]
name = "zenith-core"
version = "0.3.22"
description = "Zenith - cross-platform AI & Developer System Manager"
authors = ["Zenith Team"]
edition = "2021"
# Lowest toolchain that builds the locked dependency set, verified by bisecting
# `cargo check --locked`: sysinfo 0.39.6 requires rustc 1.95, and specta
# 2.0.0-rc.25 (pinned by tauri-specta) uses `core::fmt::from_fn`, which
# stabilized in 1.93.0; 1.92.0 and older fail with E0658 in that crate.
# notify-rust 4.18.0 also requires 1.89.0, above the 1.77.2 floor that fixes
# CVE-2024-24576 (batch-file argument escaping on Windows, relevant because
# Zenith spawns .cmd/.bat shims there). The CI `msrv` job installs exactly this
# toolchain and runs `just check-msrv`.
rust-version = "1.95.0"
license = "MIT"
repository = "https://github.com/jaeyoung0509/zenith"

[lib]
name = "zenith_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "Zenith"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = ["macos-private-api", "tray-icon", "image-png"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"
uuid = { version = "1.10", features = ["v4", "serde"] }
sysinfo = "0.39"
walkdir = "2.5"
libc = "0.2"
base64 = "0.23"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls-native-roots", "system-proxy"] }
sha2 = "0.11"
url = "2.5"
specta = { version = "=2.0.0-rc.25", features = ["derive", "uuid"] }
tauri-specta = { version = "=2.0.0-rc.25", features = ["typescript"] }
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
rfd = "0.17"
regex = "1.10"
plist = "1.7"
trash = "5.2"
rayon = "1.12"
tokio = { version = "1", features = ["sync", "time", "rt", "macros", "process", "io-util"] }

[target.'cfg(target_os = "macos")'.dependencies]
tauri = { version = "2.0", features = ["macos-private-api"] }
security-framework = "3"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_SystemInformation",
    "Win32_System_Power",
    "Win32_System_Threading",
    "Win32_System_JobObjects",
    "Win32_Storage_FileSystem",
    "Win32_Security",
    "Win32_Security_Credentials",
    "Win32_Globalization",
    "Win32_UI_WindowsAndMessaging",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_UI_Shell",
    "Win32_System_Registry",
] }

[dev-dependencies]
tempfile = "3.13"
specta-typescript = "=0.0.12"
# `tauri::test` builds the state a command handler reads without a window, so an
# integration test can assert the IPC surface answers from the injected
# environment. The feature is a no-op flag and adds no dependency.
tauri = { version = "2.0", features = ["test"] }

[features]
# Plain `cargo build` must produce a self-contained desktop binary. The
# Tauri CLI disables default features for `tauri dev`, so development still
# uses `build.devUrl`, while direct/release builds serve the embedded `dist`.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
