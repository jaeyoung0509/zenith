version: 2
updates:
  # Rust dependencies. The workspace manifest lives in src-tauri/ but
  # Cargo.lock is at the repository root, so Dependabot watches the root.
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - rust
    commit-message:
      prefix: "chore(deps)"
    groups:
      # Routine minor/patch updates land as one reviewable pull request.
      cargo-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      # Major upgrades stay separate so each one gets its own CI run and review.
      cargo-major:
        patterns:
          - "*"
        update-types:
          - major

  # Frontend dependencies. pnpm reads the npm ecosystem and the pnpm-lock.yaml
  # lockfile at the repository root.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - javascript
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      npm-major:
        patterns:
          - "*"
        update-types:
          - major
    ignore:
      # The typecheck gate runs svelte-check, which type-checks against
      # TypeScript 6. TypeScript 7 is only reachable through its `--tsgo` flag,
      # which additionally requires the aliased native compiler and documents
      # the same limitations as `--incremental`. Keep the major out of the
      # group until svelte-check supports TypeScript 7 without that flag; the
      # 6.x line stays eligible for fixes above.
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"
