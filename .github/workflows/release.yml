name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-mac:
    name: Build Unsigned Public Beta (macOS ARM64)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> src-tauri/target'

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Verify release tag matches versions
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAURI_VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          CARGO_VERSION=$(grep '^version' src-tauri/Cargo.toml | head -1 | cut -d'"' -f2)

          echo "Tag version:        $TAG_VERSION"
          echo "package.json:       $PKG_VERSION"
          echo "Cargo.toml:         $CARGO_VERSION"
          echo "tauri.conf.json:    $TAURI_VERSION"

          if [ "$TAG_VERSION" != "$PKG_VERSION" ] || [ "$TAG_VERSION" != "$CARGO_VERSION" ] || [ "$TAG_VERSION" != "$TAURI_VERSION" ]; then
            echo "❌ Version mismatch detected! Tag and all manifests must be identical."
            exit 1
          fi
          echo "✅ Release tag matches all manifest versions: $TAG_VERSION"

      - name: Generate Tauri bindings & verify drift
        run: |
          mkdir -p dist
          cargo test --manifest-path src-tauri/Cargo.toml --lib tests::export_typescript_bindings -- --ignored --exact
          git diff --exit-code -- src/lib/bindings/tauri.ts

      - name: Run checks & tests
        run: |
          pnpm check
          pnpm test
          cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build frontend
        run: pnpm build

      - name: Build macOS DMG Bundle (ARM64)
        run: pnpm tauri build --target aarch64-apple-darwin

      - name: Prepare Release Artifacts, Checksums, and Metadata
        run: |
          set -e
          mkdir -p artifacts

          DMG_PATH=$(find target/aarch64-apple-darwin/release/bundle/dmg src-tauri/target/aarch64-apple-darwin/release/bundle/dmg target/release/bundle/dmg src-tauri/target/release/bundle/dmg -name "*.dmg" 2>/dev/null | head -n 1)

          if [ -z "$DMG_PATH" ] || [ ! -f "$DMG_PATH" ]; then
            echo "❌ Failed to locate built DMG package!"
            exit 1
          fi

          echo "Found DMG at: $DMG_PATH"
          cp "$DMG_PATH" artifacts/

          cat <<EOF > artifacts/BUILD_INFO.txt
          Zenith macOS Public Beta
          Target: aarch64-apple-darwin (Apple Silicon)
          Version: $(node -p "require('./package.json').version")
          Commit: ${GITHUB_SHA}
          Ref: ${GITHUB_REF_NAME}
          Build Date: $(date -u +"%Y-%m-%dT%H:%M:%SZ")
          EOF

          cd artifacts
          shasum -a 256 *.dmg > SHA256SUMS
          cat SHA256SUMS
          echo "--- BUILD INFO ---"
          cat BUILD_INFO.txt

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zenith-macos-arm64
          path: |
            artifacts/*.dmg
            artifacts/SHA256SUMS
            artifacts/BUILD_INFO.txt
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: |
            artifacts/*.dmg
            artifacts/SHA256SUMS
            artifacts/BUILD_INFO.txt
          prerelease: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
