name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-release:
    name: Verify Release Source
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Linux dependencies for Tauri binding export
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release versions
        env:
          RELEASE_REF: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: node scripts/bump_version.cjs check "$RELEASE_REF"

      - name: Generate Tauri bindings
        run: |
          mkdir -p dist
          cargo test --manifest-path src-tauri/Cargo.toml --lib tests::export_typescript_bindings -- --ignored --exact

      - name: Verify generated bindings and Cargo.lock
        run: git diff --exit-code -- src/lib/bindings/tauri.ts Cargo.lock

      - name: Run frontend checks and tests
        run: |
          pnpm check
          pnpm test -- --run
          pnpm build

      - name: Upload verified frontend
        uses: actions/upload-artifact@v7
        with:
          name: release-frontend-dist
          path: dist
          if-no-files-found: error

  release-mac:
    name: Build Unsigned Public Beta (macOS ARM64)
    needs: verify-release
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download verified frontend
        uses: actions/download-artifact@v8
        with:
          name: release-frontend-dist
          path: dist

      - name: Run macOS Rust checks
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path src-tauri/Cargo.toml
          cargo check --manifest-path src-tauri/Cargo.toml

      - name: Build macOS DMG bundle (ARM64)
        run: pnpm tauri build --target aarch64-apple-darwin --bundles dmg --config .github/tauri.package-ci.json

      - name: Prepare macOS release artifacts
        run: |
          set -euo pipefail
          mkdir -p artifacts

          DMG_PATHS=$(find target src-tauri/target -path '*/release/bundle/dmg/*.dmg' -type f 2>/dev/null || true)
          DMG_COUNT=$(printf '%s\n' "$DMG_PATHS" | sed '/^$/d' | wc -l | tr -d ' ')
          if [ "$DMG_COUNT" -ne 1 ]; then
            echo "Expected exactly one macOS DMG, found $DMG_COUNT"
            exit 1
          fi
          DMG_PATH="$DMG_PATHS"

          cp "$DMG_PATH" artifacts/Zenith-macos-arm64.dmg
          cat > artifacts/BUILD_INFO-macos-arm64.txt <<EOF
          Zenith macOS Public Beta
          Target: aarch64-apple-darwin (Apple Silicon)
          Version: $(node -p "require('./package.json').version")
          Commit: ${GITHUB_SHA}
          Ref: ${GITHUB_REF_NAME}
          Signed: no
          Notarized: no
          Build Date: $(date -u +"%Y-%m-%dT%H:%M:%SZ")
          EOF
          node scripts/release_checksums.cjs write \
            --file artifacts/Zenith-macos-arm64.dmg \
            --output artifacts/SHA256SUMS-macos-arm64.txt

      - name: Upload macOS release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: zenith-release-macos-arm64
          path: |
            artifacts/Zenith-macos-arm64.dmg
            artifacts/SHA256SUMS-macos-arm64.txt
            artifacts/BUILD_INFO-macos-arm64.txt
          if-no-files-found: error

  release-windows:
    name: Build Unsigned Public Beta (Windows x64 NSIS)
    needs: verify-release
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Rust toolchain (MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download verified frontend
        uses: actions/download-artifact@v8
        with:
          name: release-frontend-dist
          path: dist

      - name: Run Windows Rust checks
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path src-tauri/Cargo.toml
          cargo check --manifest-path src-tauri/Cargo.toml

      - name: Build Windows NSIS bundle (x64 current user)
        run: pnpm tauri build --target x86_64-pc-windows-msvc --bundles nsis --config .github/tauri.package-ci.json

      - name: Prepare Windows release artifacts and WinGet manifests
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $searchRoots = @('target', 'src-tauri/target') | Where-Object { Test-Path $_ }
          $installers = @(Get-ChildItem -Path $searchRoots -Filter '*.exe' -File -Recurse |
            Where-Object { $_.FullName -match '[\\/]release[\\/]bundle[\\/]nsis[\\/]' })
          if ($installers.Count -ne 1) {
            throw "Expected exactly one NSIS installer, found $($installers.Count)"
          }

          $artifactName = 'Zenith-windows-x64-setup.exe'
          $artifactPath = Join-Path artifacts $artifactName
          Copy-Item -Path $installers[0].FullName -Destination $artifactPath
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $buildDate = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
          @"
          Zenith Windows Public Beta
          Target: x86_64-pc-windows-msvc
          Package: NSIS current-user installer
          WebView2: download bootstrapper
          Version: $version
          Commit: $env:GITHUB_SHA
          Ref: $env:GITHUB_REF_NAME
          Signed: no
          Build Date: $buildDate
          "@ | Set-Content -Path artifacts/BUILD_INFO-windows-x64.txt -Encoding utf8

          node scripts/release_checksums.cjs write `
            --file $artifactPath `
            --output artifacts/SHA256SUMS-windows-x64.txt
          node scripts/generate_winget_manifest.cjs `
            --version $version `
            --installer $artifactPath `
            --output artifacts/winget

      - name: Upload Windows release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: zenith-release-windows-x64
          path: |
            artifacts/Zenith-windows-x64-setup.exe
            artifacts/SHA256SUMS-windows-x64.txt
            artifacts/BUILD_INFO-windows-x64.txt
            artifacts/winget/**
          if-no-files-found: error

  publish-release:
    name: Publish Combined GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [release-mac, release-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout release scripts
        uses: actions/checkout@v5

      - name: Download platform artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: zenith-release-*
          path: artifacts
          merge-multiple: true

      - name: Combine platform checksums
        run: |
          node scripts/release_checksums.cjs combine \
            --output artifacts/SHA256SUMS.txt \
            artifacts/SHA256SUMS-macos-arm64.txt \
            artifacts/SHA256SUMS-windows-x64.txt
          (cd artifacts && shasum -a 256 -c SHA256SUMS.txt)

      - name: Create one prerelease with macOS and Windows assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/Zenith-macos-arm64.dmg
            artifacts/Zenith-windows-x64-setup.exe
            artifacts/SHA256SUMS.txt
            artifacts/SHA256SUMS-macos-arm64.txt
            artifacts/SHA256SUMS-windows-x64.txt
            artifacts/BUILD_INFO-macos-arm64.txt
            artifacts/BUILD_INFO-windows-x64.txt
            artifacts/winget/**/*.yaml
          prerelease: true
          generate_release_notes: true
          body: |
            ## Public beta signing notice

            The macOS ARM64 build is not notarized and the Windows x64 NSIS installer is not yet code signed. Windows users should expect Microsoft Defender SmartScreen to show an unknown-publisher warning. Verify the published SHA256 checksum before running the installer.

            Zenith is applying for SignPath Foundation open-source code signing after this first Windows release. A future release will replace the transition build with a verified, timestamped signature; installer binaries for this version will not be overwritten.
