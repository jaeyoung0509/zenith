name: CI
on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

jobs:
  rust:
    name: Rust Checks & Tests (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> src-tauri/target'

      - name: Rust Format Check
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Rust Clippy Linter
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Rust Unit & Safety Tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Rust Cargo Check
        run: cargo check --manifest-path src-tauri/Cargo.toml

  frontend:
    name: Frontend Checks & Build (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Frontend Dependencies
        run: pnpm install

      - name: Svelte Typecheck
        run: pnpm check

      - name: Vitest Frontend Tests
        run: pnpm test

      - name: Vite Production Build
        run: pnpm build
