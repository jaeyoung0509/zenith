name: CI
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: write

jobs:
  ci:
    name: Full CI Pipeline (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> src-tauri/target'

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Frontend Dependencies
        run: pnpm install

      - name: Generate Tauri bindings
        run: |
          mkdir -p dist
          cargo test --manifest-path src-tauri/Cargo.toml --lib tests::export_typescript_bindings -- --ignored --exact

      - name: Sync generated Cargo.lock to PR branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor == 'jaeyoung0509'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          if git diff --quiet -- Cargo.lock; then
            exit 0
          fi
          lock_sha="$(gh api "repos/${GITHUB_REPOSITORY}/contents/Cargo.lock?ref=${HEAD_BRANCH}" --jq .sha)"
          lock_content="$(base64 < Cargo.lock | tr -d '\n')"
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/Cargo.lock" \
            -f message='chore: update Cargo.lock for version 0.1.7' \
            -f content="${lock_content}" \
            -f sha="${lock_sha}" \
            -f branch="${HEAD_BRANCH}"
          git add Cargo.lock
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m 'chore: update Cargo.lock for version 0.1.7'

      - name: Verify generated bindings (drift check)
        run: git diff --exit-code -- src/lib/bindings/tauri.ts

      - name: Verify Cargo.lock (drift check)
        run: git diff --exit-code -- Cargo.lock

      - name: Svelte Typecheck
        run: pnpm check

      - name: Vitest Frontend Tests
        run: pnpm test

      - name: Vite Production Build
        run: pnpm build

      - name: Rust Format Check
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Rust Clippy Linter
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Rust Unit & Safety Tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Rust Cargo Check
        run: cargo check --manifest-path src-tauri/Cargo.toml
