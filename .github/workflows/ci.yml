name: CI
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend & Bindings Verification (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Frontend Dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Tauri bindings
        run: |
          mkdir -p dist
          cargo test --manifest-path src-tauri/Cargo.toml --lib tests::export_typescript_bindings -- --ignored --exact

      - name: Verify generated bindings (drift check)
        run: git diff --exit-code -- src/lib/bindings/tauri.ts

      - name: Verify Cargo.lock (drift check)
        run: git diff --exit-code -- Cargo.lock

      - name: Svelte Typecheck
        run: pnpm check

      - name: Vitest Frontend Tests
        run: pnpm test -- --run

      - name: Vite Production Build
        run: pnpm build

  ci-macos:
    name: Native CI & Packaging (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        id: rust-cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        id: node-cache
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Report dependency cache status
        run: |
          echo "Rust cache hit: ${{ steps.rust-cache.outputs.cache-hit }}"
          echo "pnpm cache hit: ${{ steps.node-cache.outputs.cache-hit }}"

      - name: Install Frontend Dependencies
        run: pnpm install --frozen-lockfile

      - name: Rust Format Check
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Rust Clippy Linter
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Rust Unit & Safety Tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Rust Cargo Check
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Install just
        uses: taiki-e/install-action@just

      - name: Release installer regression tests
        run: just test-release-installer

      - name: Vite Production Build
        run: pnpm build

      # The tagged/manual Release workflow owns optimized DMG packaging.
      # CI only needs to prove that the current frontend is embedded in a macOS app bundle.
      - name: Build debug app bundle (embedded frontend check)
        run: just build-fast

  ci-windows:
    name: Native CI & Packaging (Windows x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain (MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc
          components: rustfmt, clippy

      - name: Rust Cache
        id: rust-cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        id: node-cache
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Frontend Dependencies
        run: pnpm install --frozen-lockfile

      - name: Rust Format Check
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Rust Clippy Linter
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Rust Unit & Safety Tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Rust Cargo Check
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Vite Production Build
        run: pnpm build

      # Keep the first Windows packaging check to NSIS. MSI requires the
      # optional VBSCRIPT feature and is intentionally covered by the release
      # issue after the Windows adapter work is complete.
      - name: Build debug NSIS installer (embedded frontend check)
        run: pnpm tauri build --debug --bundles nsis

      - name: Upload Windows packaging smoke artifact
        uses: actions/upload-artifact@v4
        with:
          name: zenith-windows-x64-nsis-debug
          path: |
            target/debug/bundle/nsis/*-setup.exe
            src-tauri/target/debug/bundle/nsis/*-setup.exe
          if-no-files-found: error
