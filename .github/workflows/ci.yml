name: CI
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend & IPC Contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux dependencies for Tauri binding export
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        id: rust-cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Setup Node.js
        id: node-cache
        uses: actions/setup-node@v5
        with:
          # The exact floor of the dependency set (jsdom 30 requires
          # ^22.22.2 || ^24.15.0 || >=26.0.0). The gate runs on the floor so a
          # dependency that raises it fails here instead of on a user's machine;
          # the packaging jobs cover the newest patch of the line.
          node-version: '22.22.2'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Frontend Dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Tauri bindings and platform golden data
        run: |
          mkdir -p dist
          cargo test --manifest-path src-tauri/Cargo.toml --lib tests::export_typescript_bindings -- --ignored --exact
          cargo test --manifest-path src-tauri/Cargo.toml --lib tests::export_platform_capability_golden -- --ignored --exact
          cargo test --manifest-path src-tauri/Cargo.toml --lib tests::export_platform_context_golden -- --ignored --exact

      - name: Verify generated bindings, platform golden data, and Cargo.lock
        run: git diff --exit-code -- src/lib/bindings/tauri.ts src/lib/bindings/platform-capabilities.golden.json src/lib/bindings/platform-context.golden.json Cargo.lock

      - name: Svelte Typecheck
        run: pnpm check

      - name: Vitest Frontend Tests
        run: pnpm test -- --run

      - name: Vite Production Build
        run: pnpm build

      - name: Upload verified frontend
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: dist
          if-no-files-found: error

      - name: Report dependency cache status
        run: |
          echo "Rust cache hit: ${{ steps.rust-cache.outputs.cache-hit }}"
          echo "pnpm cache hit: ${{ steps.node-cache.outputs.cache-hit }}"

  rust-macos:
    name: Rust Checks (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - name: Prepare Tauri frontend directory
        run: mkdir -p dist

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          # `just check-architecture` reads `cargo metadata`, so the crate
          # boundary rule needs a Node runtime in the Rust jobs too.
          node-version: 22

      - name: Install just
        uses: taiki-e/install-action@just

      # The recipes are the single command surface; CI must not repeat them.
      - name: Rust format and lint gate
        run: just lint-rust

      - name: Rust Unit & Safety Tests
        run: just test-rust

      # The committed scan baseline is generated data, like the TypeScript
      # bindings: the export test regenerates it and the diff is the gate. The
      # fixture facts are platform-independent by construction (the two fixtures
      # that cannot exist off unix are asserted by their own tests and are not in
      # this file), so the same file is regenerated and diffed on both platform
      # jobs.
      - name: Generate the scan benchmark baseline
        run: cargo test -p zenith-desktop --test scan_benchmark -- --ignored --exact export_scan_baseline

      - name: Verify the generated scan benchmark baseline
        run: git diff --exit-code -- src-tauri/tests/fixtures/scan-baseline.json

      # Prints the metrics table for this platform: one JSON object per fixture
      # after a line naming the OS, the architecture, and the crate version, so a
      # real-machine baseline can be read out of the log.
      - name: Report the scan benchmark metrics
        run: cargo test -p zenith-desktop --test scan_benchmark -- --nocapture

      - name: Rust Cargo Check
        run: just check-rust

      - name: Crate boundary rule
        run: just check-architecture

      - name: Release installer regression tests
        run: just test-release-installer

  rust-windows:
    name: Rust Checks (Windows x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain (MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - name: Prepare Tauri frontend directory
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path dist | Out-Null

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          # `just check-architecture` reads `cargo metadata`, so the crate
          # boundary rule needs a Node runtime in the Rust jobs too.
          node-version: 22

      - name: Install just
        uses: taiki-e/install-action@just

      # The recipes are the single command surface; CI must not repeat them.
      - name: Rust format and lint gate
        run: just lint-rust

      - name: Rust Unit & Safety Tests
        run: just test-rust

      # The same generated baseline, regenerated and diffed on this platform:
      # its fixture facts are platform-independent by construction, and the
      # reported table is this machine's measurement of them.
      - name: Generate the scan benchmark baseline
        run: cargo test -p zenith-desktop --test scan_benchmark -- --ignored --exact export_scan_baseline

      - name: Verify the generated scan benchmark baseline
        run: git diff --exit-code -- src-tauri/tests/fixtures/scan-baseline.json

      - name: Report the scan benchmark metrics
        run: cargo test -p zenith-desktop --test scan_benchmark -- --nocapture

      - name: Rust Cargo Check
        run: just check-rust

      - name: Crate boundary rule
        run: just check-architecture

  msrv:
    name: Minimum Supported Rust Version (1.95.0)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain (the declared rust-version)
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - name: Install just
        uses: taiki-e/install-action@just

      - name: Verify the declared rust-version builds this tree
        run: just check-msrv

  msrv-windows:
    name: Minimum Supported Rust Version (Windows target)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain (the declared rust-version)
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - name: Install just
        uses: taiki-e/install-action@just

      # Every Windows dependency is target-gated and the `#[cfg(windows)]`
      # bodies are where the largest platform work landed, so a macOS runner
      # resolves none of it. Part of the declared floor exists for Windows
      # (CVE-2024-24576 batch-file argument escaping), so it is verified here
      # too, against the same target set the lint gate uses.
      - name: Verify the declared rust-version builds this tree on Windows
        run: just check-msrv

  supply-chain:
    name: Supply Chain Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-deny
        uses: taiki-e/install-action@cargo-deny

      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install just
        uses: taiki-e/install-action@just

      - name: Audit locked dependencies for both ecosystems
        run: just supply-chain

  package-macos:
    name: Package Smoke (macOS)
    needs: [frontend, rust-macos]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Download verified frontend
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: dist

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Frontend Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build debug app bundle from verified frontend
        run: pnpm tauri build --debug --bundles app --config .github/tauri.package-ci.json

  package-windows:
    name: Package Smoke (Windows x64 NSIS)
    needs: [frontend, rust-windows]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Download verified frontend
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: dist

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Frontend Dependencies
        run: pnpm install --frozen-lockfile

      - name: Install just
        uses: taiki-e/install-action@just

      - name: Build debug NSIS installer (per-user default)
        run: pnpm tauri build --debug --bundles nsis --config .github/tauri.package-ci.json

      - name: Smoke-test the per-user installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path packaging | Out-Null
          $installers = @(
            Get-ChildItem -Path target, src-tauri/target -Filter '*-setup.exe' -Recurse -File -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match '[\\/]bundle[\\/]nsis[\\/]' }
          )
          if ($installers.Count -ne 1) {
            throw "Expected exactly one per-user NSIS installer, found $($installers.Count)"
          }
          Copy-Item -Path $installers[0].FullName -Destination packaging/Zenith-windows-x64-setup.exe
          just test-package "$($installers[0].FullName)"

      - name: Clear NSIS output before the machine-wide build
        shell: pwsh
        run: Remove-Item -Recurse -Force -ErrorAction SilentlyContinue target/debug/bundle/nsis, src-tauri/target/debug/bundle/nsis

      - name: Build debug NSIS installer (machine-wide)
        run: pnpm tauri build --debug --bundles nsis --config .github/tauri.nsis-permachine.json

      - name: Stage the machine-wide installer
        shell: pwsh
        run: |
          $installers = @(
            Get-ChildItem -Path target, src-tauri/target -Filter '*-setup.exe' -Recurse -File -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match '[\\/]bundle[\\/]nsis[\\/]' }
          )
          if ($installers.Count -ne 1) {
            throw "Expected exactly one machine-wide NSIS installer, found $($installers.Count)"
          }
          Copy-Item -Path $installers[0].FullName -Destination packaging/Zenith-windows-x64-setup-machine.exe

      # The machine-wide package is the one a policy-managed machine needs, so it
      # gets the same install, doctor, and uninstall gate as the per-user one.
      - name: Smoke-test the machine-wide installer
        shell: pwsh
        run: just test-package packaging/Zenith-windows-x64-setup-machine.exe perMachine

      - name: Upload Windows packaging smoke artifacts
        uses: actions/upload-artifact@v7
        with:
          name: zenith-windows-x64-nsis-debug
          path: packaging/*-setup.exe
          if-no-files-found: error
