name: CI
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Full CI Pipeline (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        id: rust-cache
        uses: Swatinem/rust-cache@v2
        with:
          # Cargo runs from the repository workspace, so target is the root
          # target directory. The previous value created a nested
          # src-tauri/src-tauri/target cache that Cargo never used.
          workspaces: '. -> target'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        id: node-cache
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Report dependency cache status
        run: |
          echo "Rust cache hit: ${{ steps.rust-cache.outputs.cache-hit }}"
          echo "pnpm cache hit: ${{ steps.node-cache.outputs.cache-hit }}"

      - name: Install Frontend Dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Tauri bindings
        run: |
          mkdir -p dist
          cargo test --manifest-path src-tauri/Cargo.toml --lib tests::export_typescript_bindings -- --ignored --exact

      - name: Verify generated bindings (drift check)
        run: git diff --exit-code -- src/lib/bindings/tauri.ts

      - name: Verify Cargo.lock (drift check)
        run: git diff --exit-code -- Cargo.lock

      - name: Svelte Typecheck
        run: pnpm check

      - name: Vitest Frontend Tests
        run: pnpm test

      - name: Vite Production Build
        run: pnpm build

      - name: Rust Format Check
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Rust Clippy Linter
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Rust Unit & Safety Tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Rust Cargo Check
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Install just
        uses: taiki-e/install-action@just

      - name: Release installer regression tests
        run: just test-release-installer

      # The tagged/manual Release workflow owns optimized DMG packaging.
      # CI only needs to prove that the current frontend is embedded in a macOS app bundle.
      - name: Build debug app bundle (embedded frontend check)
        run: just build-fast
