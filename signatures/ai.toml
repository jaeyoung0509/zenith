# Zenith Signatures - AI Tools
# Defines scanning patterns and safety rules for AI assistant caches and transient files.

[[signatures]]
id = "ai.claude.logs"
name = "Claude Code Logs"
category = "ai"
family = "developer"
risk = "manual"
strategy = "manual"
paths = [
    "~/.claude/logs",
    "~/.claude/mcp-logs"
]
description = "Diagnostic and MCP interaction logs reported for review; upstream does not expose a narrow cleanup contract that proves they contain no session state."

[[signatures]]
id = "ai.claude.cache"
name = "Claude Code Cache"
category = "ai"
family = "developer"
risk = "manual"
strategy = "manual"
paths = [
    "~/.claude/cache",
    "~/.claude/tmp"
]
description = "A mixed CLI cache root reported for review; prompt, session, authentication, and configuration state must not be inferred disposable from the directory name."

[[signatures]]
id = "ai.cursor.cache"
name = "Cursor Editor Cache"
category = "ai"
family = "developer"
risk = "rebuild"
strategy = "delete_contents"
paths = [
    "~/Library/Caches/Cursor",
    "~/Library/Application Support/Cursor/Cache",
    "~/Library/Application Support/Cursor/Code Cache",
    "~/Library/Application Support/Cursor/GPUCache",
    "${ROAMING_APP_DATA}/Cursor/Cache",
    "${ROAMING_APP_DATA}/Cursor/Code Cache",
    "${ROAMING_APP_DATA}/Cursor/GPUCache"
]
description = "V8 code cache, GPU shader cache, and webview temporary storage for Cursor."

[[signatures]]
id = "ai.cursor.logs"
name = "Cursor Session Logs"
category = "ai"
family = "developer"
risk = "manual"
strategy = "manual"
paths = [
    "~/Library/Application Support/Cursor/logs",
    "${ROAMING_APP_DATA}/Cursor/logs"
]
description = "Editor and language-server logs reported for review because they can contain session and diagnostic state."

[[signatures]]
id = "ai.cursor.extensions.cache"
name = "Cursor Extensions Cache"
category = "ai"
family = "developer"
risk = "manual"
strategy = "manual"
paths = [
    "~/.cursor/extensions/cache"
]
description = "Extension-related storage reported for review; generic cleanup cannot prove which packages remain installed or user-selected."

[[signatures]]
id = "ai.gemini.cache"
name = "Gemini CLI & Antigravity Cache"
category = "ai"
family = "developer"
risk = "manual"
strategy = "manual"
paths = [
    "~/.gemini/antigravity-cli/tmp",
    "~/.gemini/antigravity-cli/cache",
    "~/.gemini/cache"
]
exclusions = [
    "~/.gemini/antigravity-cli/cache/onboarding.json",
    "~/.gemini/antigravity-cli/cache/default_project_id.txt",
    "onboarding.json",
    "default_project_id.txt"
]
description = "Mixed CLI storage reported for review; onboarding, project, authentication, prompt, and session state remain protected."

[[signatures]]
id = "ai.gemini.logs"
name = "Gemini CLI & Antigravity Logs"
category = "ai"
family = "developer"
risk = "manual"
strategy = "manual"
paths = [
    "~/.gemini/antigravity-cli/logs",
    "~/.gemini/antigravity-cli/log"
]
description = "CLI operation and session logs reported for review rather than automatically removed."

[[signatures]]
id = "ai.codex.cache"
name = "Codex CLI Cache"
category = "ai"
family = "developer"
risk = "manual"
strategy = "manual"
paths = [
    "~/.codex/cache",
    "~/.codex/tmp"
]
description = "Mixed CLI storage reported for review; prompts, sessions, authentication, settings, and scratch state remain protected."

[[signatures]]
id = "ai.aider.cache"
name = "Aider Chat Cache"
category = "ai"
family = "developer"
risk = "manual"
strategy = "manual"
paths = [
    "~/.aider.tags.cache.v3",
    "~/.aider.cache"
]
description = "Assistant index storage reported for review until an owner contract can distinguish reproducible indexes from project state."

[[signatures]]
id = "ai.opencode.cache"
name = "OpenCode Assistant Cache"
category = "ai"
family = "developer"
risk = "manual"
strategy = "manual"
paths = [
    "~/.opencode/cache",
    "~/.opencode/logs"
]
description = "Mixed assistant cache and log storage reported for review; generic cleanup cannot prove it excludes session and authentication state."

[[signatures]]
id = "ai.gpu.directx_shader"
name = "DirectX Shader Cache"
category = "ai"
family = "developer"
risk = "rebuild"
strategy = "delete_contents"
platforms = ["windows"]
paths = ["${LOCAL_APP_DATA}/D3DSCache"]
description = "Per-user Direct3D compiled shader cache."
provider = "Microsoft Direct3D"
artifact_kind = "compiled_kernel"
consequence = "Games and GPU applications may stutter while shaders compile again."

[[signatures]]
id = "ai.gpu.nvidia_dx"
name = "NVIDIA DirectX Shader Cache"
category = "ai"
family = "developer"
risk = "rebuild"
strategy = "delete_contents"
platforms = ["windows"]
paths = ["${LOCAL_APP_DATA}/NVIDIA/DXCache"]
description = "Per-user NVIDIA DirectX compiled shader cache."
provider = "NVIDIA"
artifact_kind = "compiled_kernel"
consequence = "GPU applications may recompile shaders and stutter on first use."

[[signatures]]
id = "ai.gpu.nvidia_gl"
name = "NVIDIA OpenGL Shader Cache"
category = "ai"
family = "developer"
risk = "rebuild"
strategy = "delete_contents"
platforms = ["windows"]
paths = ["${LOCAL_APP_DATA}/NVIDIA/GLCache"]
description = "Per-user NVIDIA OpenGL compiled shader cache."
provider = "NVIDIA"
artifact_kind = "compiled_kernel"
consequence = "GPU applications may recompile shaders and stutter on first use."

[[signatures]]
id = "ai.cuda.compute_cache"
name = "CUDA JIT Compute Cache"
category = "ai"
family = "developer"
risk = "rebuild"
strategy = "delete_contents"
platforms = ["windows"]
paths = ["${ROAMING_APP_DATA}/NVIDIA/ComputeCache"]
description = "Compiled CUDA PTX-to-CUBIN artifacts in CUDA's documented Windows default."
provider = "NVIDIA CUDA"
artifact_kind = "compiled_kernel"
consequence = "CUDA workloads must compile kernels again on their next run."

[[signatures]]
id = "ai.torchinductor.temp"
name = "Inactive TorchInductor / Triton Cache"
category = "ai"
family = "developer"
risk = "rebuild"
strategy = "delete_directory"
platforms = ["macos", "windows"]
paths = ["${TEMP}"]
include_prefixes = ["torchinductor_"]
min_age_days = 3
fail_if_running = ["python", "python3", "python.exe", "vllm", "sglang"]
description = "Per-user compiled graph and kernel artifacts under the system temp directory."
provider = "PyTorch / Triton"
artifact_kind = "compiled_kernel"
consequence = "Models must recompile graphs and kernels, increasing next-run latency."

[[signatures]]
id = "ai.llamacpp.opencl.windows"
name = "llama.cpp OpenCL Program Cache"
category = "ai"
family = "developer"
risk = "rebuild"
strategy = "delete_contents"
platforms = ["windows"]
paths = ["${LOCAL_APP_DATA}/llama.cpp/cl-cache"]
fail_if_running = ["llama-cli", "llama-server", "llama-cli.exe", "llama-server.exe"]
description = "Compiled OpenCL programs; model weights and session files are excluded by scope."
provider = "llama.cpp"
artifact_kind = "compiled_kernel"
consequence = "OpenCL kernels compile again on next use."

