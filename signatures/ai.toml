# Zenith Signatures - AI Tools
# Defines scanning patterns and safety rules for AI assistant caches and transient files.

[[signatures]]
id = "ai.claude.logs"
name = "Claude Code Logs"
category = "ai"
family = "developer"
risk = "safe"
strategy = "delete_contents"
paths = [
    "~/.claude/logs",
    "~/.claude/mcp-logs"
]
description = "Diagnostic and MCP interaction logs generated during Claude Code sessions."

[[signatures]]
id = "ai.claude.cache"
name = "Claude Code Cache"
category = "ai"
family = "developer"
risk = "safe"
strategy = "delete_contents"
paths = [
    "~/.claude/cache",
    "~/.claude/tmp"
]
description = "Temporary context cache and downloaded transient assets."

[[signatures]]
id = "ai.cursor.cache"
name = "Cursor Editor Cache"
category = "ai"
family = "developer"
risk = "safe"
strategy = "delete_contents"
paths = [
    "~/Library/Caches/Cursor",
    "~/Library/Application Support/Cursor/Cache",
    "~/Library/Application Support/Cursor/Code Cache",
    "~/Library/Application Support/Cursor/GPUCache",
    "${ROAMING_APP_DATA}/Cursor/Cache",
    "${ROAMING_APP_DATA}/Cursor/Code Cache",
    "${ROAMING_APP_DATA}/Cursor/GPUCache"
]
description = "V8 code cache, GPU shader cache, and webview temporary storage for Cursor."

[[signatures]]
id = "ai.cursor.logs"
name = "Cursor Session Logs"
category = "ai"
family = "developer"
risk = "safe"
strategy = "delete_contents"
paths = [
    "~/Library/Application Support/Cursor/logs",
    "${ROAMING_APP_DATA}/Cursor/logs"
]
description = "Log files from editor sessions and language server background tasks."

[[signatures]]
id = "ai.cursor.extensions.cache"
name = "Cursor Extensions Cache"
category = "ai"
family = "developer"
risk = "rebuild"
strategy = "delete_contents"
paths = [
    "~/.cursor/extensions/cache"
]
description = "Downloaded extension VSIX packages and uncompressed asset caches."

[[signatures]]
id = "ai.gemini.cache"
name = "Gemini CLI & Antigravity Cache"
category = "ai"
family = "developer"
risk = "safe"
strategy = "delete_contents"
paths = [
    "~/.gemini/antigravity-cli/tmp",
    "~/.gemini/antigravity-cli/cache",
    "~/.gemini/cache"
]
exclusions = [
    "~/.gemini/antigravity-cli/cache/onboarding.json",
    "~/.gemini/antigravity-cli/cache/default_project_id.txt",
    "onboarding.json",
    "default_project_id.txt"
]
description = "Temporary session files and cached search/API tokens."

[[signatures]]
id = "ai.gemini.logs"
name = "Gemini CLI & Antigravity Logs"
category = "ai"
family = "developer"
risk = "safe"
strategy = "delete_contents"
paths = [
    "~/.gemini/antigravity-cli/logs",
    "~/.gemini/antigravity-cli/log"
]
description = "Historical CLI operation and session logs."

[[signatures]]
id = "ai.codex.cache"
