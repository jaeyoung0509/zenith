[[signatures]]
id = "dev.playwright.browsers"
name = "Playwright Browser Binaries"
category = "developer"
family = "package_managers"
risk = "manual"
strategy = "manual"
paths = [
    "~/Library/Caches/ms-playwright",
    "${LOCAL_APP_DATA}/ms-playwright"
]
description = "Browser binaries tracked by Playwright installations. Playwright garbage-collects unused revisions and exposes lifecycle commands, so Zenith reports this store without recursively deleting it."
provider = "Playwright"
artifact_kind = "package_store"
consequence = "Removing a required revision breaks that Playwright installation until its browsers are installed again."

