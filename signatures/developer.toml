# Zenith Signatures - Developer Tools
# Defines scanning patterns and safety rules for compilers, package managers, and build artifacts.

[[signatures]]
id = "dev.go.build"
name = "Go Build Cache"
category = "developer"
risk = "safe"
strategy = "delete_contents"
paths = [
    "~/Library/Caches/go-build",
    "~/.cache/go-build",
    "${LOCAL_APP_DATA}/go-build"
]
description = "Compiled packages and object files generated by the Go compiler."

[[signatures]]
id = "dev.go.mod"
name = "Go Module Cache"
category = "developer"
risk = "rebuild"
strategy = "delete_contents"
paths = [
    "~/go/pkg/mod/cache"
]
description = "Downloaded zipballs and module caches for Go dependencies."

