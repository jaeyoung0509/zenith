# Zenith Signatures - Developer Tools
# Defines scanning patterns and safety rules for compilers, package managers, and build artifacts.

[[signatures]]
id = "dev.homebrew.cache"
name = "Homebrew Cache"
category = "developer"
family = "package_managers"
risk = "manual"
strategy = "manual"
platforms = ["macos"]
paths = ["~/Library/Caches/Homebrew"]
provider = "Homebrew"
artifact_kind = "download_cache"
description = "Homebrew owns its download cache and its cleanup command can also remove old installed formula versions. The observed cache footprint is not a safe generic deletion target or a prediction of `brew cleanup` reclaim."

[[signatures]]
id = "dev.go.build"
name = "Go Build Cache"
category = "developer"
family = "developer"
risk = "rebuild"
strategy = "external_command"
paths = []
fail_if_running = ["go", "go.exe"]
description = "Compiled packages inspected with `go env GOCACHE` and removed with `go clean -cache`."
provider = "Go"
artifact_kind = "build_artifact"
consequence = "Go packages compile again on demand."

[[signatures]]
id = "dev.go.mod"
name = "Go Module Cache"
category = "developer"
family = "package_managers"
risk = "rebuild"
strategy = "external_command"
paths = []
fail_if_running = ["go", "go.exe"]
description = "The shared module store inspected with `go env GOMODCACHE` and removed with `go clean -modcache`."
provider = "Go"
artifact_kind = "download_cache"
