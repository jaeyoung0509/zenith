# Zenith Signatures - Developer Tools
# Defines scanning patterns and safety rules for compilers, package managers, and build artifacts.

[[signatures]]
id = "dev.go.build"
name = "Go Build Cache"
category = "developer"
risk = "safe"
strategy = "delete_contents"
paths = [
    "~/Library/Caches/go-build",
    "~/.cache/go-build",
    "${LOCAL_APP_DATA}/go-build"
]
description = "Compiled packages and object files generated by the Go compiler."
provider = "Go"
artifact_kind = "build_artifact"
consequence = "Go packages compile again on demand."

[[signatures]]
id = "dev.go.mod"
name = "Go Module Cache"
category = "developer"
risk = "rebuild"
strategy = "delete_contents"
paths = [
    "~/go/pkg/mod/cache"
]
description = "Downloaded zipballs and module caches for Go dependencies."
provider = "Go"
artifact_kind = "download_cache"
consequence = "Modules may need to be downloaded again."

[[signatures]]
id = "dev.cargo.registry.cache"
name = "Cargo Registry Cache"
category = "developer"
risk = "rebuild"
strategy = "delete_contents"
paths = [
    "~/.cargo/registry/cache"
]
description = "Downloaded .crate archive files from crates.io."
provider = "Cargo"
artifact_kind = "download_cache"
consequence = "Crates may need to be downloaded again."

[[signatures]]
id = "dev.cargo.registry.src"
name = "Cargo Registry Source"
category = "developer"
risk = "rebuild"
strategy = "delete_contents"
paths = [
    "~/.cargo/registry/src"
]
description = "Extracted source code of downloaded crates dependencies."
provider = "Cargo"
artifact_kind = "package_store"
consequence = "Crate sources must be extracted or downloaded again."

[[signatures]]
id = "dev.cargo.git"
name = "Cargo Git Checkouts"
category = "developer"
risk = "rebuild"
strategy = "delete_contents"
paths = [
    "~/.cargo/git/checkouts",
    "~/.cargo/git/db"
]
description = "Git repositories checked out and indexed by Cargo for git dependencies."
provider = "Cargo"
artifact_kind = "package_store"
consequence = "Git dependencies must be cloned again."

[[signatures]]
id = "dev.rustup.downloads"
name = "Rustup Downloads Cache"
category = "developer"
risk = "rebuild"
strategy = "delete_contents"
paths = [
    "~/.rustup/downloads",
    "~/.rustup/tmp"
]
description = "Temporary installer archives and toolchain downloads from rustup."
provider = "rustup"
artifact_kind = "download_cache"
consequence = "A future toolchain installation may download archives again."

[[signatures]]
id = "dev.npm.cache"
name = "npm Cache"
category = "developer"
risk = "rebuild"
strategy = "manual"
paths = [
    "~/.npm/_cacache",
    "~/.npm/_locks"
]
description = "Content-addressable package cache. Use npm cache verify/clean; Zenith does not delete the backing tree."
provider = "npm"
management_mode = "advisory"
artifact_kind = "package_store"
consequence = "A full cleanup can force package downloads on later installs."
reclaimable_is_lower_bound = true

[[signatures]]
id = "dev.pnpm.store"
name = "pnpm Content-Addressable Store"
category = "developer"
risk = "rebuild"
strategy = "external_command"
paths = []
description = "Global hard-link package repository inspected and pruned by pnpm."
provider = "pnpm"
management_mode = "tool_managed"
artifact_kind = "package_store"
consequence = "Unreferenced packages are removed and may be downloaded on a future install."
reclaimable_is_lower_bound = true

[[signatures]]
id = "dev.yarn.cache"
name = "Yarn Cache"
category = "developer"
risk = "rebuild"
strategy = "manual"
paths = [
    "~/Library/Caches/Yarn",
    "~/.yarn/berry/cache",
    "${LOCAL_APP_DATA}/Yarn/Cache"
]
description = "Package archives owned by Yarn. Cleanup remains advisory until a version-aware adapter is available."
provider = "Yarn"
management_mode = "advisory"
artifact_kind = "package_store"
consequence = "Packages may need to be downloaded again."

[[signatures]]
id = "dev.bun.cache"
name = "Bun Package Cache"
category = "developer"
risk = "rebuild"
strategy = "manual"
paths = [
    "~/.bun/install/cache"
]
description = "Bun's global hard-linked package store. Zenith will not recursively delete it."
provider = "Bun"
management_mode = "advisory"
artifact_kind = "package_store"
consequence = "Packages may be shared with projects and may need to be downloaded again."
reclaimable_is_lower_bound = true

[[signatures]]
id = "dev.pip.cache"
name = "Pip Cache"
category = "developer"
risk = "rebuild"
strategy = "manual"
paths = [
    "~/Library/Caches/pip",
    "~/.cache/pip",
    "${LOCAL_APP_DATA}/pip/cache"
]
description = "Python wheels and distributions owned by pip. Use pip cache commands for cleanup."
provider = "pip"
management_mode = "advisory"
artifact_kind = "download_cache"
consequence = "Python packages may need to be downloaded and rebuilt."

[[signatures]]
id = "dev.uv.cache"
name = "uv Python Package Cache"
category = "developer"
risk = "rebuild"
strategy = "external_command"
paths = []
description = "High-speed package cache inspected and pruned by uv's supported cache command."
provider = "uv"
management_mode = "tool_managed"
artifact_kind = "package_store"
consequence = "Unused packages are pruned and may be downloaded again."
reclaimable_is_lower_bound = true

[[signatures]]
id = "dev.xcode.derived_data"
name = "Xcode DerivedData"
category = "developer"
risk = "rebuild"
strategy = "delete_contents"
paths = [
    "~/Library/Developer/Xcode/DerivedData"
]
description = "Intermediate build products, indexes, and module caches generated by Xcode and Swift."
provider = "Xcode"
artifact_kind = "build_artifact"
consequence = "Projects rebuild and Xcode re-indexes on next use."

[[signatures]]
id = "dev.xcode.archives"
name = "Xcode Archives"
category = "developer"
risk = "manual"
strategy = "delete_contents"
paths = [
    "~/Library/Developer/Xcode/Archives"
]
description = "Archived application builds and dSYMs exported for distribution."
provider = "Xcode"
management_mode = "advisory"
artifact_kind = "build_artifact"
consequence = "Archives may be required for symbolication or distribution."

[[signatures]]
id = "dev.xcode.caches"
name = "Xcode System Caches"
category = "developer"
risk = "safe"
strategy = "delete_contents"
paths = [
    "~/Library/Caches/com.apple.dt.Xcode",
    "~/Library/Developer/CoreSimulator/Caches"
]
description = "Diagnostic caches, documentation indexes, and Simulator temporary assets."
provider = "Xcode"
artifact_kind = "temporary"
consequence = "Xcode may rebuild indexes or simulator caches."

[[signatures]]
id = "dev.gradle.caches"
name = "Gradle Caches"
category = "developer"
risk = "rebuild"
strategy = "manual"
paths = [
    "~/.gradle/caches"
]
description = "Gradle owns retention and locking for this shared cache; Zenith reports it as advisory only."
provider = "Gradle"
management_mode = "advisory"
artifact_kind = "package_store"
consequence = "Deleting entries can force dependency downloads and expensive task rebuilds."
reclaimable_is_lower_bound = true

[[signatures]]
id = "dev.m2.repository"
name = "Maven Local Repository"
category = "developer"
risk = "rebuild"
strategy = "manual"
paths = [
    "~/.m2/repository"
]
description = "Maven's mixed local repository requires project-aware purge semantics; Zenith reports it only."
provider = "Maven"
management_mode = "advisory"
artifact_kind = "package_store"
consequence = "Dependencies and plugins may need to be downloaded again."
reclaimable_is_lower_bound = true
