# Zenith Signatures - Developer Tools
# Defines scanning patterns and safety rules for compilers, package managers, and build artifacts.

[[signatures]]
id = "dev.go.build"
name = "Go Build Cache"
category = "developer"
risk = "safe"
strategy = "delete_contents"
paths = [
    "~/Library/Caches/go-build",
    "~/.cache/go-build",
    "${LOCAL_APP_DATA}/go-build"
]
fail_if_running = ["go", "go.exe"]
description = "Compiled packages and object files generated by the Go compiler."
provider = "Go"
artifact_kind = "build_artifact"
consequence = "Go packages compile again on demand."

[[signatures]]
id = "dev.go.mod"
name = "Go Module Cache"
category = "developer"
risk = "rebuild"
strategy = "delete_contents"
paths = [
    "~/go/pkg/mod/cache"
]
fail_if_running = ["go", "go.exe"]
description = "Downloaded zipballs and module caches for Go dependencies."
provider = "Go"
artifact_kind = "download_cache"
consequence = "Modules may need to be downloaded again."

[[signatures]]
id = "dev.cargo.registry.cache"
name = "Cargo Registry Cache"
category = "developer"
# Owner-scoped: Cargo's downloaded archives are enumerated and removed by the
# provider that owns the store. The signature names the owner; it grants no
# filesystem authority, and the provider re-derives every unit it removes.
risk = "rebuild"
strategy = "owner_provider"
provider_id = "cargo.registry.archive"
paths = []
platforms = ["macos", "windows", "linux"]
fail_if_running = ["cargo", "cargo.exe", "rustc", "rustc.exe"]
description = "Downloaded .crate archive files Cargo keeps per registry index."
provider = "Cargo"
artifact_kind = "download_cache"
consequence = "Crates may need to be downloaded again."

[[signatures]]
id = "dev.cargo.registry.src"
name = "Cargo Registry Source"
category = "developer"
# Owner-managed store: Cargo writes and reuses these trees while it resolves
# dependencies, and their downloaded contents legitimately contain names
# (`Cargo.lock`, package lockfiles, scripts, configuration, database-like
# fixtures) that generic cleanup must keep protecting in an ordinary tree. The
# store stays inventoried — its bytes are real — and is never submitted to
# generic recursive deletion.
risk = "manual"
strategy = "owner_provider"
provider_id = "cargo.registry.source"
paths = []
platforms = ["macos", "windows", "linux"]
fail_if_running = ["cargo", "cargo.exe", "rustc", "rustc.exe"]
description = "Extracted source trees Cargo owns for downloaded crates. Cargo's own cache garbage collection decides whether they are stale."
provider = "Cargo"
artifact_kind = "package_store"
consequence = "Cargo re-extracts a crate from its archive when a build needs it again."

[[signatures]]
id = "dev.cargo.git"
name = "Cargo Git Checkouts"
category = "developer"
# Same owner boundary as `dev.cargo.registry.src`: a checkout is a working tree
# with its own locks and local modifications, so neither an age rule nor a
# filename rule can decide what inside it is disposable.
risk = "manual"
strategy = "owner_provider"
provider_id = "cargo.git"
paths = []
platforms = ["macos", "windows", "linux"]
fail_if_running = ["cargo", "cargo.exe", "rustc", "rustc.exe"]
description = "Git checkouts and bare databases Cargo owns for git dependencies. Cargo decides when they are unreferenced."
provider = "Cargo"
artifact_kind = "package_store"
consequence = "Cargo clones a git dependency again when a build needs it."

[[signatures]]
id = "dev.rustup.downloads"
name = "Rustup Downloads Cache"
category = "developer"
risk = "rebuild"
strategy = "delete_contents"
paths = [
    "~/.rustup/downloads",
    "~/.rustup/tmp"
]
fail_if_running = ["rustup", "rustup.exe"]
description = "Temporary installer archives and toolchain downloads from rustup."
provider = "rustup"
artifact_kind = "download_cache"
consequence = "A future toolchain installation may download archives again."

[[signatures]]
id = "dev.npm.cache"
name = "npm Cache"
category = "developer"
risk = "rebuild"
strategy = "external_command"
paths = []
description = "Content-addressable package cache inspected and pruned by npm."
provider = "npm"
artifact_kind = "package_store"
consequence = "A full cleanup can force package downloads on later installs."

[[signatures]]
id = "dev.pnpm.store"
name = "pnpm Content-Addressable Store"
category = "developer"
risk = "rebuild"
strategy = "external_command"
paths = []
description = "Global hard-link package repository inspected and pruned by pnpm."
provider = "pnpm"
artifact_kind = "package_store"
consequence = "Unreferenced packages are removed and may be downloaded on a future install."

[[signatures]]
id = "dev.yarn.cache"
name = "Yarn Cache"
category = "developer"
# Yarn 1 and Yarn Berry keep different structures and expose no pruning command
# the planner can verify, so this stays a manual, adapter-owned target: the
# planner refuses a plan it cannot execute instead of offering one.
risk = "manual"
strategy = "manual"
paths = [
    "~/Library/Caches/Yarn",
    "~/.yarn/berry/cache",
    "${LOCAL_APP_DATA}/Yarn/Cache"
]
description = "Package archives owned by Yarn. Cleanup remains advisory until a version-aware adapter is available."
provider = "Yarn"
artifact_kind = "package_store"
consequence = "Packages may need to be downloaded again."

[[signatures]]
id = "dev.bun.cache"
name = "Bun Package Cache"
category = "developer"
risk = "rebuild"
strategy = "manual"
paths = [
    "~/.bun/install/cache"
]
description = "Bun's global hard-linked package store. Zenith will not recursively delete it."
provider = "Bun"
artifact_kind = "package_store"
consequence = "Packages may be shared with projects and may need to be downloaded again."

[[signatures]]
id = "dev.pip.cache"
name = "Pip Cache"
category = "developer"
risk = "rebuild"
strategy = "manual"
paths = [
    "~/Library/Caches/pip",
    "~/.cache/pip",
    "${LOCAL_APP_DATA}/pip/cache"
]
description = "Python wheels and distributions owned by pip. Use pip cache commands for cleanup."
provider = "pip"
artifact_kind = "download_cache"
consequence = "Python packages may need to be downloaded and rebuilt."

[[signatures]]
id = "dev.uv.cache"
name = "uv Python Package Cache"
category = "developer"
risk = "rebuild"
strategy = "external_command"
paths = []
description = "High-speed package cache inspected and pruned by uv's supported cache command."
provider = "uv"
artifact_kind = "package_store"
consequence = "Unused packages are pruned and may be downloaded again."

[[signatures]]
id = "dev.xcode.derived_data"
name = "Xcode DerivedData"
category = "developer"
risk = "rebuild"
strategy = "delete_contents"
platforms = ["macos"]
paths = [
    "~/Library/Developer/Xcode/DerivedData"
]
fail_if_running = ["xcodebuild"]
description = "Intermediate build products, indexes, and module caches generated by Xcode and Swift."
provider = "Xcode"
artifact_kind = "build_artifact"
consequence = "Projects rebuild and Xcode re-indexes on next use."

[[signatures]]
id = "dev.xcode.archives"
name = "Xcode Archives"
category = "developer"
risk = "manual"
strategy = "manual"
platforms = ["macos"]
paths = [
    "~/Library/Developer/Xcode/Archives"
]
fail_if_running = ["xcodebuild"]
description = "Archived application builds and dSYMs exported for distribution."
