# Zenith Signatures - Local LLM Models
# Local models are ALWAYS classified as 'manual' risk and NEVER auto-selected.

[[signatures]]
id = "model.ollama.manifests"
name = "Ollama Model Manifests"
category = "model"
risk = "manual"
strategy = "manual"
paths = [
    "~/.ollama/models/manifests"
]
description = "Model tags and layer mapping configurations in Ollama."

[[signatures]]
id = "model.ollama.blobs"
name = "Ollama Model Blobs"
category = "model"
risk = "manual"
strategy = "manual"
paths = [
    "~/.ollama/models/blobs"
]
description = "GGUF and safetensors weights downloaded by Ollama."

[[signatures]]
